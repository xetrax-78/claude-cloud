name: CI

on:
  pull_request:
  push:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Contrôle navigateur du build (routes, recherche, comparateur, mobile, erreurs console…)
      - run: npx playwright install --with-deps chromium
      - name: Tests navigateur
        run: |
          npx vite preview --port 4175 --strictPort &
          npx --yes wait-on@8 -t 60000 http://localhost:4175/
          BASE=http://localhost:4175/ SHOTS=shots npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: shots/
